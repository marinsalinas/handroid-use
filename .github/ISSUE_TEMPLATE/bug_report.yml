name: Bug report
description: Something in handroid-use does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove serial numbers, IP addresses and anything personal
        from the output you paste.
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      placeholder: handroid fps droiddeck 30 --wait
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Include the full output (stdout and stderr) and the exit code (`echo $?` / `$LASTEXITCODE`).
      render: text
    validations:
      required: true
  - type: textarea
    id: discover
    attributes:
      label: "`handroid discover --json` output"
      description: Replace the serial with something like ABC123XYZ and the IPs with 192.168.1.x.
      render: json
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS (and shell), Node version, `adb version`, handroid-use version or commit.
      placeholder: Windows 11 / PowerShell, Node 22.11, adb 37.0.1, v0.1.0
    validations:
      required: true
  - type: textarea
    id: raw
    attributes:
      label: Raw adb output (optional)
      description: If a parser is wrong, the raw output it read helps most (e.g. `adb shell dumpsys SurfaceFlinger --list`, `adb exec-out uiautomator dump /dev/tty`). We can turn it into a test fixture.
      render: text
